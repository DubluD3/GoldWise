name: Lua regression tests

"on":
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Lua 5.1 / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [syntax, unit, contract, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1
      - name: Run offline check
        env:
          GOLDWISE_TEST_SUITE: ${{ matrix.suite }}
        run: sh scripts/test.sh "$GOLDWISE_TEST_SUITE"

  candidate-package:
    name: Validate QA candidate ZIP
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manifest, privacy and candidate ZIP
        run: sh scripts/package.sh candidate
      - name: Assert public release is blocked without license and owner sign-off
        run: |
          if sh scripts/package.sh release; then
            echo 'ERROR: unreleased test candidate unexpectedly accepted as a release' >&2
            exit 1
          fi
          echo 'PASS owner/license release gate remains closed'
      - name: Upload candidate for owner QA (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GoldWise-QA-candidate-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
