name: Lua regression tests

"on":
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Lua 5.1 / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [syntax, unit, contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1
      - name: Run offline check
        env:
          GOLDWISE_TEST_SUITE: ${{ matrix.suite }}
        run: sh scripts/test.sh "$GOLDWISE_TEST_SUITE"
